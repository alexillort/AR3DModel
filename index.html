<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F3">
<title>Modelo AR</title>
<meta name="description" content="Coloca modelos de Sketchfab en tu espacio con realidad aumentada, con sus texturas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --paper:#EDF0F3;--ink:#161D27;--slate:#5B6878;--line:#CBD3DD;--stage:#E2E7ED;--signal:#FFC531;--signal-deep:#E8AC00;--danger:#B4232C;--white:#FFFFFF;
  --r-lg:22px;--r-md:12px;--r-sm:8px;
  font-family:"Familjen Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--paper);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--paper)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:disabled{opacity:.5;cursor:progress}

/* Estructura */
.shell{max-width:1280px;margin:0 auto;padding:20px clamp(16px,3.5vw,40px) 32px;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px 36px;min-height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;flex:none}
.brand{font-size:21px;font-weight:700;letter-spacing:-.02em}
.iconBtn{margin-left:auto;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--slate)}
.iconBtn:hover{color:var(--ink);border-color:var(--ink)}

/* Panel de control */
.panel{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.intro h1{font-size:clamp(28px,3.2vw,38px);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:0 0 10px}
.intro p{margin:0;color:var(--slate);max-width:34ch}
.label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}
.linkBox{display:flex;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-md);padding:5px;transition:border-color .15s}
.linkBox:focus-within{border-color:var(--ink)}
.linkBox .input{border:0;padding:11px 10px;background:transparent}
.linkBox .input:focus-visible{outline:none}
.input{width:100%;min-width:0;background:var(--white);color:var(--ink);border:1.5px solid var(--line);padding:12px 13px;border-radius:var(--r-sm);outline:none}
.input:focus{border-color:var(--ink)}
.input::placeholder{color:#8A96A5}
.primary{border:0;background:var(--ink);color:var(--white);padding:11px 18px;border-radius:var(--r-sm);font-weight:600;white-space:nowrap}
.primary:hover{background:#2A3546}
.signalBtn{border:0;background:var(--signal);color:var(--ink);font-weight:700;border-radius:999px;padding:11px 18px;white-space:nowrap}
.signalBtn:hover{background:var(--signal-deep)}

.token{border-top:1px solid var(--line);padding-top:22px}
.tokenSaved{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--slate)}
.tokenSaved .dot{width:9px;height:9px;border-radius:50%;background:#2E9E5B;flex:none;box-shadow:0 0 0 3px #2E9E5B26}
.tokenSaved span{flex:1}
.tokenField{display:flex;gap:8px}
.tokenRow{display:flex;align-items:center;gap:14px;margin-top:9px;font-size:13px}
.spacer{flex:1}
.help{color:var(--slate);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.help:hover{color:var(--ink);text-decoration-color:currentColor}
.linkBtn{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.linkBtn:hover{text-decoration-color:currentColor}
.linkBtn.danger{color:var(--danger)}
.note{font-size:13px;color:var(--slate);margin:10px 0 0;max-width:38ch}

.upload{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:14px 15px;cursor:pointer;color:var(--slate);font-size:15px}
.upload strong{color:var(--ink);font-weight:600}
.upload:hover,.upload:focus-within{border-color:var(--ink);color:var(--ink)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload svg{flex:none}
.error{color:var(--danger);font-size:14px;line-height:1.45;margin:-8px 0 0;padding-left:12px;border-left:3px solid var(--danger)}
.error:empty{display:none}

/* Visor: piso de AR */
.stage{display:flex;flex-direction:column;min-height:560px}
.viewport{position:relative;flex:1;min-height:460px;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(#F4F6F8 0%,var(--stage) 55%,#D6DDE5 100%);isolation:isolate}
.floor{position:absolute;left:-60%;right:-60%;bottom:-4%;height:78%;z-index:-1;pointer-events:none;
  background-image:linear-gradient(#9FADBD 1.5px,transparent 1.5px),linear-gradient(90deg,#9FADBD 1.5px,transparent 1.5px);background-size:64px 64px;background-position:center bottom;
  transform:perspective(480px) rotateX(60deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 35%,transparent 95%);mask-image:linear-gradient(to top,#000 35%,transparent 95%)}
.hud{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none}
.hud strong{font-size:15px;font-weight:600;background:#EDF0F3D9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--ink);color:var(--white);padding:6px 12px 6px 10px;border-radius:999px}
.status:empty{display:none}
.status::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid #FFFFFF55;border-top-color:var(--signal);animation:spin .8s linear infinite}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 13%;text-align:center}
.reticle{width:min(210px,52vw);height:auto;overflow:visible}
.reticle .pulse{transform-origin:100px 60px;animation:pulse 2.6s ease-out infinite}
.empty p{margin:0;font-size:16px;color:var(--slate);max-width:30ch}
.viewer,.viewer iframe,.viewer model-viewer{position:absolute;inset:0;width:100%;height:100%;border:0}
model-viewer{--poster-color:transparent;background:transparent}
.arButton{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--signal);color:var(--ink);padding:14px 24px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 10px 30px #16212F33}
.arButton:hover{background:var(--signal-deep)}
.arButton svg{width:20px;height:20px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 4px 0}
.attribution{font-size:13px;color:var(--slate);flex:1 1 260px}
.attribution a{color:var(--ink)}
.actions{display:flex;align-items:center;gap:16px;margin-left:auto}
.actions a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.actions a:hover{text-decoration-color:currentColor}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.55);opacity:.9}80%,100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.reticle .pulse{animation:none;opacity:.5}.status::before{animation-duration:2.4s}}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;gap:16px;padding:14px 14px 24px}
  .panel{display:contents}
  .intro{order:1}.linkGroup{order:2}.errorWrap{order:3}.stage{order:4}.token{order:5}.fileGroup{order:6}
  .intro h1{font-size:28px}
  .error{margin:0}
  .stage{min-height:0}
  .viewport{min-height:62dvh;border-radius:18px}
  .token{border-top:0;padding-top:4px}
  .tokenField{flex-direction:column}
  .actions{margin-left:0}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><ellipse cx="17" cy="21" rx="13" ry="6" fill="none" stroke="#161D27" stroke-width="2"/><ellipse cx="17" cy="21" rx="5" ry="2.3" fill="#FFC531"/><path d="M17 4v12" stroke="#161D27" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="brand">Modelo AR</div>
    <button id="settingsBtn" class="iconBtn" type="button" aria-label="Configurar token de Sketchfab" title="Configurar token de Sketchfab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="panel" aria-label="Cargar modelo">
    <div class="intro">
      <h1>Tu modelo, en tu espacio</h1>
    </div>

    <div class="linkGroup">
      <label class="label visually-hidden" for="link">Enlace de Sketchfab</label>
      <form id="linkForm" class="linkBox">
        <input class="input" id="link" type="url" inputmode="url" autocomplete="url" placeholder="Pega un enlace de Sketchfab" required>
        <button id="open" class="primary" type="submit">Abrir</button>
      </form>
    </div>

    <div class="errorWrap"><div id="error" class="error" role="alert" aria-live="polite"></div></div>

    <div class="token">
      <div id="tokenSaved" class="tokenSaved hidden"><i class="dot" aria-hidden="true"></i><span>Token guardado</span><button id="tokenEdit" class="linkBtn" type="button">Cambiar</button></div>
      <div id="tokenEditor">
        <label class="label" for="personalToken">Token de Sketchfab</label>
        <div class="tokenField">
          <input class="input" id="personalToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Token API">
          <button id="tokenSave" class="primary" type="button">Guardar</button>
        </div>
        <div class="tokenRow">
          <a class="help" href="https://sketchfab.com/settings/password" target="_blank" rel="noopener noreferrer">Obtener token</a>
          <span class="spacer"></span>
          <button id="tokenCancel" class="linkBtn hidden" type="button">Cancelar</button>
          <button id="tokenClear" class="linkBtn danger hidden" type="button">Borrar token</button>
        </div>
      </div>
    </div>

    <div class="fileGroup">
      <label class="upload" for="file">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></svg>
        <span>Abrir <strong>.glb o .zip</strong></span>
        <input id="file" type="file" accept=".zip,.glb,application/zip,model/gltf-binary">
      </label>
    </div>
  </section>

  <section class="stage" aria-label="Visor 3D">
    <div class="viewport">
      <div class="floor" aria-hidden="true"></div>
      <div class="hud"><strong id="stageTitle">Vista 3D</strong><span id="status" class="status" role="status" aria-live="polite"></span></div>
      <div id="empty" class="empty">
        <svg class="reticle" viewBox="0 0 200 120" aria-hidden="true">
          <ellipse class="pulse" cx="100" cy="60" rx="92" ry="34" fill="none" stroke="#FFC531" stroke-width="3"/>
          <ellipse cx="100" cy="60" rx="62" ry="23" fill="none" stroke="#161D27" stroke-width="2.5"/>
          <ellipse cx="100" cy="60" rx="9" ry="3.5" fill="#161D27"/>
        </svg>
        
      </div>
      <div id="viewer" class="viewer hidden"></div>
    </div>
    <div class="foot">
      <div id="attribution" class="attribution hidden"></div>
      <div id="actions" class="actions hidden">
        <a id="source" target="_blank" rel="noopener noreferrer">Ver en Sketchfab</a>
        <button id="loadAR" class="signalBtn hidden" type="button">Ver en AR</button>
      </div>
    </div>
  </section>
</div>
<script defer src="./app.js"></script>
</body>
</html>
