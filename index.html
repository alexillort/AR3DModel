</style></head><body><div class="shell"><header class="top"><div class="logo" aria-hidden="true">◈</div><div class="brand">Modelo AR</div><button id="settingsBtn" class="iconBtn" type="button" aria-label="Configurar token de Sketchfab" title="Configurar token de Sketchfab">⚙</button></header><main class="layout"><section class="panel" aria-label="Cargar modelo"><label class="label" for="link">Enlace de Sketchfab</label><form id="linkForm" class="field"><input class="input" id="link" type="url" inputmode="url" autocomplete="url" placeholder="https://sketchfab.com/3d-models/..." required><button id="open" class="primary" type="submit">Abrir</button></form><div class="group"><div id="tokenSaved" class="tokenSaved hidden"><span>🔑 Token de Sketchfab guardado en este navegador</span><button id="tokenEdit" class="linkBtn" type="button">Configurar</button></div><div id="tokenEditor"><label class="label" for="personalToken">Token API de Sketchfab</label><div class="field"><input class="input" id="personalToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Token API"><button id="tokenSave" class="primary" type="button">Guardar</button></div><div class="tokenRow"><a class="help" href="https://sketchfab.com/settings/password" target="_blank" rel="noopener noreferrer">Obtener token ↗</a><span class="spacer"></span><button id="tokenCancel" class="linkBtn hidden" type="button">Cancelar</button><button id="tokenClear" class="linkBtn danger hidden" type="button">Borrar token</button></div><p class="note">Se guarda solo en este navegador para no tener que escribirlo de nuevo.</p></div></div><div class="or">o</div><label class="upload" for="file"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#176dc7" stroke-width="1.8"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>Seleccionar archivo <strong>.zip o .glb</strong></span><input id="file" type="file" accept=".zip,.glb,application/zi
